services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pa-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - app-data:/app/data
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - DATABASE_URL=file:./data/app.db
    networks:
      - pa-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pa-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pa-network

volumes:
  app-data:
    name: pa-app-data

networks:
  pa-network:
    name: pa-network
